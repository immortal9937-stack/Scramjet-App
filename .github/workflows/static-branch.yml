name: Publish static build to the "static" branch

# jsDelivr serves files straight from a GitHub branch, so the built site has to live in one.
# Result: https://cdn.jsdelivr.net/gh/<user>/<repo>@static/index.svg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: node scripts/build-static.mjs
        env:
          # Optional: Settings > Secrets and variables > Actions > Variables
          WISP_URL: ${{ vars.WISP_URL }}

      - name: Push dist/ to the static branch
        run: |
          cd dist
          git init -q -b static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" static
